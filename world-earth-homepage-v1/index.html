<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#010307" />
    <title>World Earth · World Color Integration V1</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="world" aria-label="用户从宇宙，看见了自己在地球上的美好瞬间">
      <canvas id="earth-canvas" aria-label="可旋转的真实地球"></canvas>
      <section id="life-layer" aria-label="真实生命资料">
        <div id="thumbnail-layer" aria-label="地点照片"></div>
      </section>
      <nav id="world-controls" aria-label="世界控制">
        <button id="motion-toggle" type="button" aria-pressed="false" title="暂停世界">Ⅱ</button>
        <button id="previous-memory" type="button" title="上一段生命资料">‹</button>
        <button id="next-memory" type="button" title="下一段生命资料">›</button>
      </nav>
      <button id="provenance-toggle" type="button" aria-expanded="false">关于这幅世界</button>
      <aside id="provenance" hidden><strong>事实与表达边界</strong><p>真实地貌、真实夜光与真实生命资料保持独立；电影语言只改变可读表达，不改变事实位置。</p></aside>
      <div id="loading" role="status">正在建立完整世界色彩</div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
